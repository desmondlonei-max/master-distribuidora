<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Adega</title>
    <!-- LOGO NA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen overflow-x-hidden">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-100">
            <div class="text-center mb-6">
                <!-- LOGO NO LOGIN -->
                <img src="/logo.png" alt="Logo Adega" class="w-16 h-16 sm:w-20 sm:h-20 mx-auto rounded-full object-cover mb-3 shadow-md border border-gray-200">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-800">Painel Administrativo</h2>
            </div>
            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-xs sm:text-sm font-bold mb-2">Senha Mestre</label>
                    <input type="password" id="senha-mestre" class="w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 border-gray-300" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition text-sm shadow-sm">Entrar</button>
            </form>
        </div>
    </div>

    <!-- CONTEÚDO DO PAINEL -->
    <div id="painel-content" class="hidden">
        <header class="bg-gray-900 text-white py-4 px-4 sm:px-6 flex justify-between items-center shadow sticky top-0 z-40">
            <!-- LOGO E NOME NO TOPO DO PAINEL -->
            <div class="flex items-center gap-3">
                <img src="https://media.discordapp.net/attachments/1439826547988107367/1541549309890142208/IMG_2933.JPG_2.jpeg?ex=6a8dff2c&is=6a8cadac&hm=59d7ce44594f92dc85c8239d011f9f36080bf4e6645ce7844fa09633e0b29cdd&=&format=webp&width=1024&height=664" alt="Logo" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full object-cover border border-gray-700 shadow-sm">
                <h1 class="text-base sm:text-xl font-bold truncate">Adega - Admin</h1>
            </div>
            <button onclick="logout()" class="bg-red-600 px-3 py-1.5 rounded-lg text-xs sm:text-sm hover:bg-red-700 font-semibold transition">Sair</button>
        </header>

        <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6 sm:space-y-8">

            <!-- CARD DE RELATÓRIO SEMANAL -->
            <div class="bg-blue-600 text-white p-4 sm:p-6 rounded-2xl shadow-lg grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                <div class="bg-blue-700/50 p-4 rounded-xl border border-blue-500/30">
                    <span class="text-xs sm:text-sm uppercase tracking-wider text-blue-200 font-medium">Pedidos na Semana</span>
                    <h3 id="rel-pedidos" class="text-2xl sm:text-3xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-blue-700/50 p-4 rounded-xl border border-blue-500/30">
                    <span class="text-xs sm:text-sm uppercase tracking-wider text-blue-200 font-medium">Faturamento Semanal</span>
                    <h3 id="rel-faturamento" class="text-2xl sm:text-3xl font-bold mt-1">R$ 0,00</h3>
                </div>
                <div class="bg-blue-700/50 p-4 rounded-xl border border-blue-500/30">
                    <span class="text-xs sm:text-sm uppercase tracking-wider text-blue-200 font-medium">Lucro Semanal</span>
                    <h3 id="rel-lucro" class="text-2xl sm:text-3xl font-bold mt-1 text-emerald-300">R$ 0,00</h3>
                </div>
            </div>

            <!-- GERENCIAR PRODUTOS -->
            <section class="bg-white p-4 sm:p-6 rounded-2xl shadow border border-gray-200">
                <h2 id="titulo-form" class="text-base sm:text-lg font-bold mb-4 text-gray-800">Cadastrar Produto</h2>
                <form id="form-produto" onsubmit="salvarProduto(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="hidden" id="produto-id">
                    <input type="text" id="nome" placeholder="Nome do Produto (Ex: Gelo Saborizado)" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" id="marca" placeholder="Marca" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <!-- PREÇO DE VAREJO / BASE -->
                    <input type="number" step="0.01" id="preco" placeholder="Preço Padrão / Unidade (R$)" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    
                    <!-- PREÇO DE ATACADO -->
                    <input type="number" step="0.01" id="preco_atacado" placeholder="Preço Atacado / Pacote (R$)" class="border rounded-xl px-3 py-2 text-sm bg-blue-50/50 border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <input type="number" step="0.01" id="preco_custo" placeholder="Preço de Custo (R$)" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <input type="number" id="estoque" placeholder="Estoque Disponível" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" id="volume" placeholder="Volume (ex: 200g)" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" step="0.1" id="teor_alcoolico" placeholder="Teor Alcoólico (%)" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <!-- CAMPO DE SABORES -->
                    <input type="text" id="sabores" placeholder="Sabores (Sep. por vírgula: ex: Melancia, Maçã Verde)" class="border border-blue-300 bg-blue-50/30 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <input type="text" id="imagem" placeholder="URL da Imagem" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <select id="status" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="disponivel">Disponível</option>
                        <option value="poucas_unidades">Poucas Unidades</option>
                        <option value="esgotado">Esgotado</option>
                    </select>

                    <!-- CAMPO: TIPO ESPECIAL DE PRODUTO (GELO) -->
                    <div class="md:col-span-3 flex items-center gap-2 bg-purple-50 border border-purple-200 p-3 rounded-xl">
                        <input type="checkbox" id="eh_gelo_especial" class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                        <label for="eh_gelo_especial" class="text-xs sm:text-sm font-semibold text-purple-950 cursor-pointer">Gelo Especial: (1 un: R$ 4,00 | 6 un: R$ 20,00 | >10 un: R$ 2,50/cada)</label>
                    </div>

                    <!-- CAMPO: DESTAQUE NA VITRINE -->
                    <div class="md:col-span-3 flex items-center gap-2 bg-gray-50 border border-gray-200 p-3 rounded-xl">
                        <input type="checkbox" id="destaque" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="destaque" class="text-xs sm:text-sm font-semibold text-gray-700 cursor-pointer">Exibir nas Ofertas / Destaques da Página Inicial 🔥</label>
                    </div>

                    <textarea id="descricao" placeholder="Descrição" class="border border-gray-300 rounded-xl px-3 py-2 text-sm md:col-span-3 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="2"></textarea>
                    
                    <div class="md:col-span-3 flex flex-col sm:flex-row gap-2 pt-2">
                        <button type="submit" class="bg-green-600 text-white px-5 py-2.5 rounded-xl hover:bg-green-700 font-bold transition text-sm shadow-sm">Salvar Produto</button>
                        <button type="button" id="btn-cancelar" onclick="limparFormulario()" class="hidden bg-gray-500 text-white px-5 py-2.5 rounded-xl hover:bg-gray-600 font-semibold transition text-sm">Cancelar</button>
                    </div>
                </form>

                <div class="mt-8 overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[700px]">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs sm:text-sm text-gray-600">
                                <th class="p-3">Nome</th>
                                <th class="p-3">Preço Padrão</th>
                                <th class="p-3">Preço Atacado</th>
                                <th class="p-3">Regra Especial</th>
                                <th class="p-3">Estoque</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos" class="text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </section>

            <!-- HISTÓRICO DE PEDIDOS -->
            <section class="bg-white p-4 sm:p-6 rounded-2xl shadow border border-gray-200">
                <h2 class="text-base sm:text-lg font-bold mb-4 text-gray-800">Histórico de Pedidos</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[750px]">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs sm:text-sm text-gray-600">
                                <th class="p-3">Cliente</th>
                                <th class="p-3">Endereço / Contato</th>
                                <th class="p-3">Itens</th>
                                <th class="p-3">Total</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-pedidos" class="text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script>
        const API_URL = '';
        let adminToken = sessionStorage.getItem('admin_token') || '';

        async function apiFetch(url, options = {}) {
            const headers = { ...(options.headers || {}) };
            if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
            return fetch(url, { ...options, headers });
        }
        let produtosCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('admin_logado') === 'true') {
                mostrarPainel();
            }
        });

        async function fazerLogin(e) {
            e.preventDefault();
            const senha = document.getElementById('senha-mestre').value;
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha })
                });
                const dados = await res.json();
                if (!res.ok) throw new Error(dados.erro || 'Senha incorreta!');
                adminToken = dados.token;
                sessionStorage.setItem('admin_token', adminToken);
                sessionStorage.setItem('admin_logado', 'true');
                mostrarPainel();
            } catch (err) {
                alert(err.message || 'Erro ao fazer login.');
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logado');
            sessionStorage.removeItem('admin_token');
            adminToken = '';
            location.reload();
        }

        function mostrarPainel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('painel-content').classList.remove('hidden');
            carregarRelatorioSemanal();
            carregarProdutos();
            carregarPedidos();
        }

        async function carregarRelatorioSemanal() {
            try {
                const res = await apiFetch(`${API_URL}/relatorio-semanal`);
                const dados = await res.json();
                
                const totalPedidos = Number(dados.total_pedidos) || 0;
                const faturamento = Number(dados.faturamento) || 0;
                const lucro = Number(dados.lucro) || 0;

                document.getElementById('rel-pedidos').textContent = totalPedidos;
                document.getElementById('rel-faturamento').textContent = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;
                document.getElementById('rel-lucro').textContent = `R$ ${lucro.toFixed(2).replace('.', ',')}`;
            } catch (err) {
                console.error('Erro ao carregar relatório:', err);
                document.getElementById('rel-pedidos').textContent = '0';
                document.getElementById('rel-faturamento').textContent = 'R$ 0,00';
                document.getElementById('rel-lucro').textContent = 'R$ 0,00';
            }
        }

        async function carregarProdutos() {
            try {
                const res = await apiFetch(`${API_URL}/produtos`);
                produtosCache = await res.json();
                const tbody = document.getElementById('tabela-produtos');
                tbody.innerHTML = '';

                produtosCache.forEach(p => {
                    const badgeGelo = (p.eh_gelo_especial === 1 || p.eh_gelo_especial === true)
                        ? '<span class="bg-purple-100 text-purple-700 text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full">🧊 Gelo Especial</span>'
                        : '<span class="text-gray-400 text-xs">-</span>';

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50/50">
                            <td class="p-3 font-medium text-gray-900">${p.nome}</td>
                            <td class="p-3 font-semibold">R$ ${Number(p.preco || 0).toFixed(2).replace('.', ',')}</td>
                            <td class="p-3 text-blue-600 font-semibold">R$ ${Number(p.preco_atacado || 0).toFixed(2).replace('.', ',')}</td>
                            <td class="p-3">${badgeGelo}</td>
                            <td class="p-3">${p.estoque}</td>
                            <td class="p-3">${p.status}</td>
                            <td class="p-3 text-right space-x-2 whitespace-nowrap">
                                <button onclick="editarProduto(${p.id})" class="text-blue-600 hover:underline font-semibold">Editar</button>
                                <button onclick="excluirProduto(${p.id})" class="text-red-600 hover:underline font-semibold">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Erro ao carregar produtos:', err);
            }
        }

        async function salvarProduto(e) {
            e.preventDefault();
            const id = document.getElementById('produto-id').value;
            
            const dados = {
                nome: document.getElementById('nome').value,
                marca: document.getElementById('marca').value || null,
                preco: parseFloat(document.getElementById('preco').value) || 0,
                preco_atacado: parseFloat(document.getElementById('preco_atacado').value) || 0,
                preco_custo: parseFloat(document.getElementById('preco_custo').value) || 0,
                estoque: parseInt(document.getElementById('estoque').value) || 0,
                volume: document.getElementById('volume').value || null,
                teor_alcoolico: parseFloat(document.getElementById('teor_alcoolico').value) || 0,
                sabores: document.getElementById('sabores').value || null,
                imagem: document.getElementById('imagem').value,
                status: document.getElementById('status').value,
                destaque: document.getElementById('destaque').checked ? 1 : 0,
                eh_gelo_especial: document.getElementById('eh_gelo_especial').checked ? 1 : 0,
                descricao: document.getElementById('descricao').value || null,
                categoria_id: 1
            };

            const metodo = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/produtos/${id}` : `${API_URL}/produtos`;

            try {
                const res = await apiFetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const respostaJson = await res.json().catch(() => ({}));

                if (res.ok) {
                    alert(respostaJson.mensagem || 'Produto salvo com sucesso!');
                    limparFormulario();
                    carregarProdutos();
                    carregarRelatorioSemanal();
                } else {
                    alert('Erro ao salvar produto: ' + (respostaJson.erro || 'Erro desconhecido no servidor'));
                }
            } catch (err) {
                console.error('Erro de conexão:', err);
                alert('Não foi possível conectar ao servidor. Verifique se o Node.js está rodando.');
            }
        }

        function editarProduto(id) {
            const p = produtosCache.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('produto-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('marca').value = p.marca || '';
            document.getElementById('preco').value = p.preco;
            document.getElementById('preco_atacado').value = p.preco_atacado || '';
            document.getElementById('preco_custo').value = p.preco_custo || 0;
            document.getElementById('estoque').value = p.estoque;
            document.getElementById('volume').value = p.volume || '';
            document.getElementById('teor_alcoolico').value = p.teor_alcoolico || '';
            document.getElementById('sabores').value = p.sabores || '';
            document.getElementById('imagem').value = p.imagem;
            document.getElementById('status').value = p.status;
            document.getElementById('destaque').checked = (p.destaque === 1 || p.destaque === true);
            document.getElementById('eh_gelo_especial').checked = (p.eh_gelo_especial === 1 || p.eh_gelo_especial === true);
            document.getElementById('descricao').value = p.descricao || '';

            document.getElementById('titulo-form').textContent = 'Editar Produto';
            document.getElementById('btn-cancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparFormulario() {
            document.getElementById('form-produto').reset();
            document.getElementById('produto-id').value = '';
            document.getElementById('titulo-form').textContent = 'Cadastrar Produto';
            document.getElementById('btn-cancelar').classList.add('hidden');
        }

        async function excluirProduto(id) {
            if (!confirm('Deseja realmente excluir este produto?')) return;
            
            try {
                const res = await apiFetch(`${API_URL}/produtos/${id}`, { 
                    method: 'DELETE' 
                });
                
                if (res.ok) {
                    carregarProdutos();
                    carregarRelatorioSemanal();
                } else {
                    const resultado = await res.json().catch(() => ({}));
                    alert('Erro ao excluir produto: ' + (resultado.erro || 'Erro no servidor'));
                }
            } catch (err) {
                console.error('Erro de conexão ao excluir produto:', err);
                alert('Não foi possível conectar ao servidor para excluir o produto.');
            }
        }

        async function carregarPedidos() {
            try {
                const res = await apiFetch(`${API_URL}/pedidos`);
                const pedidos = await res.json();
                const tbody = document.getElementById('tabela-pedidos');
                tbody.innerHTML = '';

                pedidos.forEach(ped => {
                    const itensTexto = ped.itens.map(i => `${i.quantidade}x ${i.nome}`).join('<br>');
                    
                    let corStatus = 'bg-yellow-100 text-yellow-800 border-yellow-300';
                    if (ped.status === 'pago') corStatus = 'bg-blue-100 text-blue-800 border-blue-300';
                    if (ped.status === 'enviado') corStatus = 'bg-purple-100 text-purple-800 border-purple-300';
                    if (ped.status === 'entregue') corStatus = 'bg-green-100 text-green-800 border-green-300';
                    if (ped.status === 'cancelado') corStatus = 'bg-red-100 text-red-800 border-red-300';

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50/50">
                            <td class="p-3 font-semibold text-gray-900">${ped.nome_cliente}</td>
                            <td class="p-3 text-xs text-gray-600">${ped.telefone}<br>${ped.endereco}</td>
                            <td class="p-3 text-xs">${itensTexto}</td>
                            <td class="p-3 font-semibold">R$ ${Number(ped.valor_total || 0).toFixed(2).replace('.', ',')}</td>
                            <td class="p-3">
                                <select onchange="atualizarStatus(${ped.id}, this.value)" class="border rounded-lg p-1.5 text-xs font-semibold cursor-pointer transition-colors duration-200 ${corStatus}">
                                    <option value="pendente" ${ped.status === 'pendente' ? 'selected' : ''} class="bg-white text-gray-800">Pendente</option>
                                    <option value="pago" ${ped.status === 'pago' ? 'selected' : ''} class="bg-white text-gray-800">Pago</option>
                                    <option value="enviado" ${ped.status === 'enviado' ? 'selected' : ''} class="bg-white text-gray-800">Enviado</option>
                                    <option value="entregue" ${ped.status === 'entregue' ? 'selected' : ''} class="bg-white text-gray-800">Entregue</option>
                                    <option value="cancelado" ${ped.status === 'cancelado' ? 'selected' : ''} class="bg-white text-gray-800">Cancelado</option>
                                </select>
                            </td>
                            <td class="p-3 text-right whitespace-nowrap">
                                <button onclick="excluirPedido(${ped.id})" class="text-red-600 hover:uideline font-semibold">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Erro ao carregar pedidos:', err);
            }
        }

        async function atualizarStatus(id, status) {
            const res = await apiFetch(`${API_URL}/pedidos/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            if (res.ok) {
                carregarPedidos();
                carregarRelatorioSemanal();
            }
        }

        async function excluirPedido(id) {
            if (!confirm('Deseja excluir este pedido?')) return;
            const res = await apiFetch(`${API_URL}/pedidos/${id}`, { method: 'DELETE' });
            if (res.ok) {
                carregarPedidos();
                carregarRelatorioSemanal();
            }
        }
    </script>
</body>
</html>
